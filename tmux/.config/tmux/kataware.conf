# Kataware — dark theme. Switch with: tmux source-file ~/.config/tmux/kataware.conf
# Pane backgrounds follow the terminal, including transparency.
set -g window-style 'none,fg=default,bg=default'
set -g window-active-style 'none,fg=default,bg=default'

# Bottom gradient status bar.
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100
set -g status-style 'none,bg=#10172A,fg=#A8B7D0'
setw -g window-status-style 'none,fg=#6B7FA2,bg=#10172A'
setw -g window-status-current-style 'none,fg=#60D7E8,bg=#1D2A49,bold'
set -g status-left '#[fg=#9B8CFF,bg=#1D2A49,bold] 󰆍  #S #[fg=#1D2A49,bg=#10172A]'
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#6B7FA2,bg=#10172A] #I #W '
setw -g window-status-current-format '#[none,fg=#0B1020,bg=#1D2A49] #[bg=#2B3B62] #[bg=#3D6F8F] #[bg=#4EA3BB] #[bg=#60D7E8,bold] #I #W #[bg=#4EA3BB] #[bg=#3D6F8F] #[bg=#2B3B62] #[bg=#1D2A49] #[default]'
set -g status-right '#{?client_prefix,#[fg=#F2C38B,bold] ✦ prefix ,}#[fg=#6B7FA2]#(whoami)@#H #[fg=#2B3B62]│ #[fg=#6CA8FF,bold]%H:%M '

# Pane borders keep the terminal background.
set -g pane-border-style 'none,fg=#2B3B62,bg=default'
set -g pane-active-border-style 'none,fg=#6B7FA2,bg=default'
setw -g pane-border-status off
setw -g pane-border-format '#{?pane_active,#[fg=#60D7E8,bold]✦ #S:#I.#P #[fg=#A8B7D0]#{pane_current_command},#[fg=#6B7FA2]#P #{pane_current_command}}'
set-hook -g window-layout-changed 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status bottom" "set-option -w pane-border-status off"'

# Native prompts/messages (tmux 3.8+ uses explicit fill).
# Enter submits, C-c cancels; in vi mode Escape enters NORMAL, then q cancels.
set -g message-style 'none,bg=#151F38,fg=#EEF3FF,fill=#151F38'
set -g message-command-style 'none,bg=#151F38,fg=#A8B7D0,fill=#151F38'
set -g message-format '#[bg=#{?command_prompt,#60D7E8,#9B8CFF},fg=#0B1020,bold]#{?prompt_type,#{?command_prompt, NORMAL , INPUT }, TMUX }#[#{?command_prompt,#{E:message-command-style},#{E:message-style}}] #{message}'
set -g prompt-cursor-colour '#9B8CFF'
set -g prompt-cursor-style blinking-bar
set -g prompt-command-cursor-colour '#60D7E8'
set -g prompt-command-cursor-style block

# Copy mode, alerts, pane numbers, and clock.
set -g mode-style 'none,bg=#1D2A49,fg=#EEF3FF'
setw -g window-status-activity-style 'fg=#F2C38B,bg=#10172A,bold'
setw -g window-status-bell-style 'fg=#0B1020,bg=#F2778B,bold'
set -g display-panes-active-colour '#60D7E8'
set -g display-panes-colour '#6B7FA2'
set -g clock-mode-colour '#9B8CFF'

# Popups keep the terminal background.
set -g popup-border-style 'bg=default,fg=#6B7FA2'
set -g popup-style 'bg=default'
set -g popup-border-lines rounded
