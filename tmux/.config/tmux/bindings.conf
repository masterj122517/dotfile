# vim-like pane switching
# bind -r ^ last-window
bind -n M-Tab last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -n M-^ last-window
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R

# pane resizing
bind -n M-, resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-. resize-pane -R 3


bind -r D neww -c "#{pane_current_path}" "[[ -e .todo.md ]] && nvim .todo.md || nvim ~/.todo.md"
# bind -r D neww -c "#{pane_current_path}" "[[ -e .schedule.md ]] && nvim .schedule.md || nvim ~/.schedule.md"


# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer"


# create session 
bind C-c new-session

# window navigation
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
unbind 0

bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9


bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-! join-pane -t :1
bind -n M-@ join-pane -t :2
bind -n 'M-#' join-pane -t :3
bind -n 'M-$' join-pane -t :4
bind -n M-% join-pane -t :5
bind -n M-^ join-pane -t :6
bind -n M-& join-pane -t :7
bind -n M-* join-pane -t :8
bind -n M-( join-pane -t :9


    bind -n M-f resize-pane -Z

    bind -n M-p split-window -v -c "#{pane_current_path}"
    bind -n M-v split-window -h -c "#{pane_current_path}"
    unbind p
    unbind n
    bind p previous-window
    bind n next-window


# # pane navigation0
    bind -n M-H swap-pane -U
    bind -n M-L swap-pane -D
    bind | swap-pane
    bind Space next-layout
    bind -n M-n new-window -c "#{pane_current_path}"
    bind -n M-N break-pane
    bind -n M-q kill-pane

if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# Links: prefix + Shift-u; lowercase u remains the sesh picker.
# Pin the source pane before opening the popup; do not type into its application.
bind-key -N "Open or copy terminal links" U run-shell -b 'tmux display-popup -E -c "#{client_name}" -w 80% -h 60% -T Links "python3 ~/.config/tmux/tmux-url-picker.py #{pane_id}"'

# sesh config 
bind-key "i" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# sesh config 
