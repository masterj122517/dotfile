set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100
set -g status-style 'bg=#10172A,fg=#A8B7D0'

# Session, windows, and the comet-bright active focus.
set -g status-left '#[fg=#0B1020,bg=#9B8CFF,bold] 󰆍 #S #[fg=#9B8CFF,bg=#10172A]'
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#6B7FA2,bg=#10172A] #I #W '
setw -g window-status-current-format '#[fg=#60D7E8,bg=#10172A]#[fg=#0B1020,bg=#60D7E8,bold] #I #W #[fg=#60D7E8,bg=#10172A]'
set -g status-right '#{?client_prefix,#[fg=#F2C38B,bold] ✦ prefix ,}#[fg=#6B7FA2]#(whoami)@#H #[fg=#2B3B62]│ #[fg=#6CA8FF,bold]%H:%M '

# Pane edges remain dark until focus catches the comet trail.
set -g pane-border-style 'fg=#2B3B62'
set -g pane-active-border-style 'fg=#9B8CFF'
setw -g pane-border-status off
setw -g pane-border-format '#{?pane_active,#[fg=#60D7E8,bold]✦ #S:#I.#P #[fg=#A8B7D0]#{pane_current_command},#[fg=#6B7FA2]#P #{pane_current_command}}'
set-hook -g window-layout-changed 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status bottom" "set-option -w pane-border-status off"'

# Alerts use the warm edge of the spectrum; copy mode uses comet blue.
set -g message-style 'bg=#9B8CFF,fg=#0B1020,bold'
set -g message-command-style 'bg=#9B8CFF,fg=#0B1020,bold'
set -g mode-style 'bg=#60D7E8,fg=#0B1020,bold'
setw -g window-status-activity-style 'fg=#F2C38B,bg=#10172A,bold'
setw -g window-status-bell-style 'fg=#0B1020,bg=#F2778B,bold'
set -g display-panes-active-colour '#60D7E8'
set -g display-panes-colour '#6B7FA2'
set -g clock-mode-colour '#9B8CFF'
