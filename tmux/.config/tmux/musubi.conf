# musubi — warm paper, quiet chrome, and ink-colored accents.
# Load after other tmux themes/plugins so these styles take precedence.

# Copy-mode selection matches Ghostty's native text selection.
set -g mode-style "none,fg=#48465B,bg=#DFD0AA"

# Quiet chrome; teal text marks focus without a solid accent-colored tab.
set -g status-style "none,fg=#625B6D,bg=#E9DEC4"
set -g window-status-style "none,fg=#71644F,bg=#E9DEC4"
set -g window-status-current-style "none,fg=#236A70,bg=#DFD0AA,bold"

# Keep pane backgrounds untouched, including transparent terminals.
set -g pane-border-style "none,fg=#B8A786,bg=default"
set -g pane-active-border-style "none,fg=#71644F,bg=default"
