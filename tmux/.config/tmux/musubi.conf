# Musubi — light theme. Switch with: tmux source-file ~/.config/tmux/musubi.conf
# Pane backgrounds follow the terminal, including transparency.
set -g window-style 'none,fg=default,bg=default'
set -g window-active-style 'none,fg=default,bg=default'

# Bottom gradient status bar.
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100
set -g status-style 'none,bg=#E9DEC4,fg=#625B6D'
setw -g window-status-style 'none,fg=#71644F,bg=#E9DEC4'
setw -g window-status-current-style 'none,fg=#236A70,bg=#DFD0AA,bold'
set -g status-left '#[fg=#80638B,bg=#DFD0AA,bold] 󰆍  #S #[fg=#DFD0AA,bg=#E9DEC4]'
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#71644F,bg=#E9DEC4] #I #W '
setw -g window-status-current-format '#[none,fg=#F5EEDC,bg=#DFD0AA] #[bg=#C8C7AA] #[bg=#9AB9AE] #[bg=#398780] #[bg=#236A70,bold] #I #W #[bg=#398780] #[bg=#9AB9AE] #[bg=#C8C7AA] #[bg=#DFD0AA] #[default]'
set -g status-right '#{?client_prefix,#[fg=#986432,bold] ✦ prefix ,}#[fg=#71644F]#(whoami)@#H #[fg=#B8A786]│ #[fg=#236A70,bold]%H:%M '

# Pane borders keep the terminal background.
set -g pane-border-style 'none,fg=#B8A786,bg=default'
set -g pane-active-border-style 'none,fg=#71644F,bg=default'
setw -g pane-border-status off
setw -g pane-border-format '#{?pane_active,#[fg=#236A70,bold]✦ #S:#I.#P #[fg=#625B6D]#{pane_current_command},#[fg=#71644F]#P #{pane_current_command}}'
set-hook -g window-layout-changed 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status bottom" "set-option -w pane-border-status off"'

# Native prompts/messages (tmux 3.8+ uses explicit fill).
# Enter submits, C-c cancels; in vi mode Escape enters NORMAL, then q cancels.
set -g message-style 'none,bg=#F1E8D3,fg=#48465B,fill=#F1E8D3'
set -g message-command-style 'none,bg=#F1E8D3,fg=#625B6D,fill=#F1E8D3'
set -g message-format '#[bg=#{?command_prompt,#236A70,#80638B},fg=#F5EEDC,bold]#{?prompt_type,#{?command_prompt, NORMAL , INPUT }, TMUX }#[#{?command_prompt,#{E:message-command-style},#{E:message-style}}] #{message}'
set -g prompt-cursor-colour '#80638B'
set -g prompt-cursor-style blinking-bar
set -g prompt-command-cursor-colour '#236A70'
set -g prompt-command-cursor-style block

# Copy mode, alerts, pane numbers, and clock.
set -g mode-style 'none,bg=#DFD0AA,fg=#48465B'
setw -g window-status-activity-style 'fg=#986432,bg=#E9DEC4,bold'
setw -g window-status-bell-style 'fg=#F5EEDC,bg=#AC4F5C,bold'
set -g display-panes-active-colour '#236A70'
set -g display-panes-colour '#71644F'
set -g clock-mode-colour '#80638B'

# Popups keep the terminal background.
set -g popup-border-style 'bg=default,fg=#71644F'
set -g popup-style 'bg=default'
set -g popup-border-lines rounded
