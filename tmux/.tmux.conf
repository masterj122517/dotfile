# original 

# --- 基础设置 ---
set -g status-interval 1
set -g status-position bottom
set -g status-justify left

# --- 颜色风格 ---
set -g status-style 'bg=#2C3347,fg=#d3c6aa'
set -g pane-border-style 'fg=#3c485e'
set -g pane-active-border-style 'fg=magenta'

# --- 核心修改：智能 Pane 边框 ---
# 默认关闭 pane border status (避免启动时闪烁)
setw -g pane-border-status off

# 定义边框格式 
setw -g pane-border-format '#[bold]#{?#{&&:#{pane_active},#{client_prefix}},#[underscore],}\
#{?pane_active,#[fg=magenta]❐ #S:#I/#{session_windows} ,}#{?window_zoomed_flag,#[fg=red]⬢,#[fg=blue]❄} \
#[fg=default]#P ⇒ #{pane_tty} #{pane_current_command}'

# 添加 Hook：当窗口布局变化时，检测 Pane 数量
# 如果 Pane 数量 > 1，则显示底部边框；否则关闭
set-hook -g window-layout-changed 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status bottom" "set-option -w pane-border-status off"'

# --- 状态栏左侧 ---
set -g status-left-length 50
set -g status-left '#[fg=magenta,bold,bg=#2C3347] ❐ #S #[fg=#3c485e]| '

# --- 状态栏右侧 ---
set -g status-right-length 100
set -g status-right '#[fg=blue,bold]#{?client_prefix,⌨ ,}#[fg=#d3c6aa] #(whoami)@#H #[fg=#3c485e]|#[fg=cyan,bold] %H:%M '

# --- 窗口列表格式 ---
setw -g window-status-separator ''
setw -g window-status-format '#[fg=#5b6c85,bg=#2C3347] #I #W '
setw -g window-status-current-format '#[fg=magenta,bold,bg=#2C3347] #I #W:#F'

# --- 消息与铃声样式 ---
setw -g window-status-activity-style 'fg=yellow,bg=#2C3347'
setw -g window-status-bell-style 'fg=red,bg=#2C3347'

set -g message-style 'bg=#d3869b,fg=#2C3347,bold'
set -g message-command-style 'bg=#d3869b,fg=#2C3347,bold'

set -g mode-style 'bg=blue,fg=#2C3347,bold'



# update-environment
set -ga update-environment '\
DISPLAY DBUS_SESSION_BUS_ADDRESS \
SESSION_MANAGER \
PATH \
XMODIFIERS \
FZF_DEFAULT_OPTS \
SSH_AUTH_SOCK \
SSH_CONNECTION \
'
