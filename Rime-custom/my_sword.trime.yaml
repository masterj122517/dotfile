# 建议放在 trime.custom.yaml 中，以 patch 形式注入
patch:
  preset_keyboards/he_shape_18:
    name: "鹤形十八键"
    ascii_mode: false
    width: 16
    height: 60
    fixed_height: 240
    # 关键：确保这里 import 的文件是存在的，通常 Trime 默认有 default
    import: default 
    keys:
      # 第一行 (6键)
      - {click: q}
      - {click: w}
      - {click: e, long_press: r, label: "E/R"}
      - {click: t, long_press: y, label: "T/Y"}
      - {click: u, long_press: i, label: "U/I"}
      - {click: o, long_press: p, label: "O/P"}
      
      # 第二行 (6键)
      - {click: a}
      - {click: s}
      - {click: d, long_press: f, label: "D/F"}
      - {click: g, long_press: h, label: "G/H"}
      - {click: j, long_press: k, label: "J/K"}
      - {click: l}
      
      # 第三行 (6键)
      - {click: BackSpace, width: 16}
      - {click: z, long_press: x, label: "Z/X"}
      - {click: c, long_press: v, label: "C/V"}
      - {click: b}
      - {click: n}
      - {click: m}
      
      # 底部功能行
      - {click: Keyboard_default, label: "123", width: 20}
      - {click: space, label: "Space", width: 60}
      - {click: Commit, label: "确认", width: 20}
